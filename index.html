<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Titan Hard - Footer Test</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body style="background-color: rgb(14, 0, 12)">
    <main style="min-height: 50vh"></main>

    <footer class="footerCustom mt-5 pt-5 pb-3">
      <div class="container">
        <div class="row gy-4 justify-content-center">
          <div class="col-12 col-lg-3 text-center text-lg-start">
            <a href="index.html" class="text-decoration-none">
              <img
                src="./assets/img/LogoHome.png"
                alt="TitanHard"
                class="logoFooter img-fluid mb-2"
              />
            </a>
            <p class="footerSubLogo">INSUMOS GAMER</p>
          </div>

          <div class="col-12 col-sm-6 col-lg-2 text-center text-lg-start">
            <h6 class="footerTitle">INFORMACIÓN</h6>
            <ul class="list-unstyled footerLinks">
              <li><a href="#">Quiénes somos</a></li>
              <li><a href="#">Envíos y entregas</a></li>
              <li><a href="#">Formas de pago</a></li>
              <li><a href="#">Preguntas frecuentes</a></li>
            </ul>
          </div>

          <div class="col-12 col-sm-6 col-lg-3 text-center text-lg-start">
            <h6 class="footerTitle">ATENCIÓN AL CLIENTE</h6>
            <ul class="list-unstyled footerLinks footerContact">
              <li>
                <a href="#"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
              </li>
              <li>
                <a
                  href="https://maps.google.com/?q=Tucuman"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  <i class="fa-solid fa-location-dot"></i> Sucursal Tucumán
                </a>
              </li>
              <li>
                <span class="footerSchedule">
                  <i class="fa-regular fa-clock"></i> Lunes a Viernes de 10 a
                  18hs
                </span>
              </li>
            </ul>
          </div>

          <div class="col-12 col-sm-6 col-lg-2 text-center text-lg-start">
            <h6 class="footerTitle">SEGUINOS</h6>
            <div class="footerSocials">
              <a href="#"><i class="fa-brands fa-instagram"></i></a>
              <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
              <a href="#"><i class="fa-brands fa-tiktok"></i></a>
              <a href="#"><i class="fa-brands fa-youtube"></i></a>
            </div>
          </div>
        </div>

        <div class="row mt-5 pt-4 footerBottom">
          <div class="col-12 col-md-6 text-center text-md-start mb-3 mb-md-0">
            <p>© 2024 Titan Hard - Todos los derechos reservados.</p>
          </div>
          <div class="col-12 col-md-6 text-center text-md-end">
            <p>
              Diseñado para gamers. Hecho con pasión.
              <i class="fa-solid fa-heart"></i>
            </p>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
