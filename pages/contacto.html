<!doctype html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Titan Hard">
    <meta name="author" content="Benjamin Federico Mendez, Francisco Agustin Delgado Ojeda, José Alejandro Abella.">
    <title>Titan Hard - Contactenos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/contacto.css">
    <link rel="icon" href="../assets/img/favicon.ico.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>
<body>
    <header></header>
    <main>
        <section class="contactenos">
    <a href="../index.html" class="link_volver">Volver a la pagina principal ⮞</a>
            <article>
                <p class="texto_contactos">Escribenos tu consulta 👾​</p>
            <div class="input">            
            <input
            type="text"
            id="nombre_apellido"
            name="nombre_apellido"
            placeholder="Escribe Tu Nombre y apellido"
            required
            minlength="3"
            maxlength="40"
            />
            <input
            type="email"
            id="email"
            name="email"
            placeholder="Email@gmail.com"
            required
            minlength="5"
            maxlength="40"
            />
            <input type="tel" 
            name="telefono" 
            placeholder="381 8238296" 
            maxlength="15">
            <textarea 
            name="Consulta" 
            id="consulta" 
            rows="5"
            required minlength="10" 
            maxlength="200" 
            placeholder="Escriba su consulta">
            </textarea>
            </div>
            </article>
        </section>
    </main>
</body>
</html>
